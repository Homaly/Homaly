# Ambiente de desenvolvimento: docker compose up --build
# Frontend em http://localhost:5173, backend em http://localhost:8000.
services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules   # mantem as dependencias da imagem, nao as da maquina

  backend:
    build: ./backend
    ports:
      # So nesta maquina: a API e as rotas /dev nao pedem login. BACKEND_HOST=0.0.0.0 no .env abre-a
      # a rede local (o telemovel da demo); BACKEND_PORT no .env se a 8000 estiver ocupada.
      - "${BACKEND_HOST:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    env_file:               # credenciais do MCP; nunca entra na imagem
      - path: .env
        required: false     # sem .env arranca na mesma, sem credenciais (ver README.md)
    environment:
      APP_MODULE: backend.main:app
      HOMALY_DEV: "1"       # pedidos /dev para pôr dados à mão (ver backend/README.md)
    volumes:
      - ./backend:/app
      - /app/.venv          # mantem o ambiente Python da imagem

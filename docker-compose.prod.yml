# Producao (VM): so o backend. O frontend e compilado por scripts/deploy.sh e servido pelo Caddy.
# Corre com: docker compose -f docker-compose.prod.yml up -d --build
# Le o .env que esta so na VM (nunca no git). Escuta so em 127.0.0.1; o Caddy faz o proxy.
services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8100:8000"
    env_file: .env
    environment:
      APP_MODULE: backend.main:app
      RECARREGAR: "0"
      DB_PATH: /data/homaly.db
    volumes:
      - homaly-data:/data

volumes:
  homaly-data:
